<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Realmfall Secure Forum Mainframe</title>
  <style>
    /* 🌌 INPVP OBSIDIAN FORUM BRAND PARAMETERS */
    :root {
      --bg-dark: #090d16;
      --panel-glass: rgba(17, 24, 39, 0.7);
      --border-glow: rgba(56, 189, 248, 0.12);
      --neon-blue: #38bdf8;
      --neon-red: #ef4444;
      --text-bright: #f8fafc;
      --text-muted: #64748b;
    }

    body {
      background-color: var(--bg-dark); color: var(--text-bright);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0; padding: 25px;
      background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, transparent 50%);
    }

    header {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--border-glow); padding-bottom: 20px; margin-bottom: 30px;
    }

    h1 { font-size: 26px; font-weight: 900; letter-spacing: -0.5px; margin: 0; color: #fff; }
    h2 { font-size: 20px; font-weight: 800; margin-top: 0; color: #fff; }

    .action-btn {
      background: #000; color: #fff; border: 1px solid var(--neon-blue);
      padding: 10px 18px; font-weight: bold; font-size: 13px; cursor: pointer;
      border-radius: 6px; text-transform: uppercase; letter-spacing: 0.5px;
      transition: 0.2s ease-in-out;
    }
    .action-btn:hover { background: var(--neon-blue); color: #000; box-shadow: 0 0 15px rgba(56,189,248,0.4); }
    .action-btn.secondary { border-color: var(--text-muted); color: var(--text-muted); background: transparent; }
    .action-btn.secondary:hover { background: #1e293b; color: #fff; }
    
    .admin-delete-btn {
      background: rgba(239, 68, 68, 0.1); color: var(--neon-red); border: 1px solid var(--neon-red);
      padding: 6px 12px; font-size: 12px; font-weight: bold; cursor: pointer; border-radius: 4px;
      margin-left: auto; transition: 0.2s;
    }
    .admin-delete-btn:hover { background: var(--neon-red); color: #fff; box-shadow: 0 0 10px rgba(239, 68, 68, 0.4); }

    .view-panel { display: block; }
    .hidden { display: none !important; }

    .forum-feed { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
    .thread-row {
      background: var(--panel-glass); border: 1px solid var(--border-glow);
      padding: 20px; border-radius: 10px; cursor: pointer; display: flex; align-items: center;
      transition: transform 0.2s, border-color 0.2s;
    }
    .thread-row:hover { transform: translateY(-2px); border-color: var(--neon-blue); }
    .thread-info { flex-grow: 1; }
    .thread-title { font-size: 18px; font-weight: bold; color: #fff; margin-bottom: 6px; }
    .thread-meta { font-size: 13px; color: var(--text-muted); display: flex; gap: 15px; }

    .input-frame { max-width: 650px; background: var(--panel-glass); border: 1px solid var(--border-glow); padding: 25px; border-radius: 12px; margin-bottom: 25px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: bold; font-size: 13px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; }
    input[type="text"], textarea {
      width: 100%; padding: 12px; border: 1px solid var(--border-glow); border-radius: 6px;
      font-size: 15px; box-sizing: border-box; background: #0b1329; color: #fff; font-family: inherit;
    }
    textarea { height: 90px; resize: vertical; }

    .nested-container { border-left: 2px solid var(--neon-blue); padding-left: 20px; margin-top: 25px; }
    .reply-card { background: rgba(255,255,255,0.02); border: 1px solid var(--border-glow); padding: 15px; border-radius: 8px; margin-bottom: 12px; display: flex; align-items: center; }
  </style>
</head>
<body>

  <!-- INTERFACE CENTRAL DASHBOARD -->
  <div id="mainDashboardView">
    <header>
      <h1 id="headerLogo">Realmfall Central</h1>
      <div style="display: flex; gap: 15px; align-items: center;">
        <span id="syncStatus" style="font-size:13px; color: var(--neon-blue); font-weight: bold;">Connecting to Deno...</span>
        <button id="globalActionBtn" class="action-btn" onclick="showNewThreadForm()">+ Create Thread</button>
      </div>
    </header>

    <!-- VIEW 1: INDEX BOARD -->
    <div id="indexView" class="view-panel">
      <h2>Active Discussion Boards</h2>
      <div class="forum-feed" id="mainThreadFeed">
        <p style="color: var(--text-muted); font-style: italic;">Fetching cloud data streams...</p>
      </div>
    </div>

    <!-- VIEW 2: TOPIC GENERATOR -->
    <div id="createView" class="view-panel hidden">
      <h2>Launch New Discussion Thread</h2>
      <div class="input-frame">
        <div class="form-group">
          <label>Your Gamertag Alias</label>
          <input type="text" id="threadAuthor" placeholder="Type your name...">
        </div>
        <div class="form-group">
          <label>Thread Topic Header Title</label>
          <input type="text" id="threadTitle" placeholder="What is this discussion about?">
        </div>
        <div class="form-group">
          <label>Opening Message Statement</label>
          <textarea id="threadContent" placeholder="Describe your topic details or server report..."></textarea>
        </div>
        <div style="display:flex; gap:10px;">
          <button class="action-btn" onclick="submitNewThread()">Publish Thread</button>
          <button class="action-btn secondary" onclick="returnToDashboard()">Cancel</button>
        </div>
      </div>
    </div>
    <!-- VIEW 3: NESTED INTERFACE TOPIC MODULE -->
    <div id="channelView" class="view-panel hidden">
      <button class="action-btn secondary" onclick="returnToDashboard()" style="margin-bottom:20px;">← Back to Index</button>
      <div class="thread-row" style="cursor:default; border-color:var(--neon-blue);">
        <div class="thread-info">
          <div id="activeThreadTitle" class="thread-title" style="font-size:22px;"></div>
          <div id="activeThreadMeta" class="thread-meta"></div>
          <p id="activeThreadBody" style="line-height:1.6; margin-top:15px; color:#cbd5e1; font-size:16px; white-space:pre-wrap;"></p>
        </div>
      </div>

      <div class="nested-container">
        <h3>Replies & Comments</h3>
        
        <div id="replyFormContainer" class="input-frame" style="padding:15px; margin-bottom:20px;">
          <div class="form-group">
            <label>Your Gamertag Alias</label>
            <input type="text" id="replyAuthor" placeholder="Your name...">
          </div>
          <div class="form-group">
            <label>Comment Message</label>
            <textarea id="replyText" style="height:60px;" placeholder="Add to the discussion thread..."></textarea>
          </div>
          <button class="action-btn" onclick="submitReply()">Submit Reply</button>
        </div>
        
        <div id="nestedReplyFeed"></div>
      </div>
    </div>
  </div>

  <script>
    // 🦖 TARGETING YOUR LIVE DENO BACKEND CLOUD
    const DENO_URL = "https://deno.net";
    const ADMIN_ACCOUNTS = ["OK-OK-game", "babah-black-sheep"];

    let threadsDatabase = [];
    let selectedThreadId = null;

    // Load full thread array from Deno server immediately at launch
    window.addEventListener('DOMContentLoaded', () => {
      fetchDenoDatabase();
      // Auto-refresh the forum data every 5 seconds so you see live updates!
      setInterval(fetchDenoDatabase, 5000);
    });

    // 📥 DOWNLOAD FROM DENO: Fetches live server entries
    async function fetchDenoDatabase() {
      const status = document.getElementById('syncStatus');
      try {
        const response = await fetch(DENO_URL);
        threadsDatabase = await response.json();
        
        // If server is fresh/empty, seed it with a welcome message
        if (threadsDatabase.length === 0) {
          threadsDatabase = [{
            id: 1714092100000,
            author: "System_Core",
            title: "Realmfall Cloud Database Engaged",
            body: "Your site is officially linked to Deno Deploy. Anyone can create topics and write replies live!",
            replies: [],
            time: "12:00 PM"
          }];
          await uploadToDeno();
        }

        status.innerText = "⚡ Deno Cloud Active";
        status.style.color = "var(--neon-blue)";
        
        // Only refresh the visible panel list
        if (document.getElementById('createView').classList.contains('hidden')) {
          if (!document.getElementById('channelView').classList.contains('hidden')) {
            const target = threadsDatabase.find(x => x.id === selectedThreadId);
            if (target) renderReplies(target.replies);
          } else {
            renderThreadIndex();
          }
        }
      } catch (err) {
        status.innerText = "⚠️ Network Latency";
        status.style.color = "var(--neon-red)";
      }
    }

    // 📤 UPLOAD TO DENO: Syncs new changes back to the server database
    async function uploadToDeno() {
      try {
        await fetch(DENO_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ threads: threadsDatabase })
        });
      } catch (err) {
        console.error("Upload error:", err);
      }
    }

    function renderThreadIndex() {
      const feed = document.getElementById('mainThreadFeed');
      feed.innerHTML = '';

      threadsDatabase.forEach(item => {
        const row = document.createElement('div');
        row.className = 'thread-row';
        
        // Admin Accounts can view and execute deletions directly
        let deleteBtnHtml = '';
        row.innerHTML = `
          <div class="thread-info" onclick="openThreadChannel(${item.id})">
            <div class="thread-title">${escapeHTML(item.title)}</div>
            <div class="thread-meta">
              <span>👤 Author: ${escapeHTML(item.author)}</span>
              <span>💬 Replies: ${item.replies.length}</span>
              <span>🕒 Posted: ${item.time}</span>
            </div>
          </div>
          ${deleteBtnHtml}
        `;
        feed.appendChild(row);
      });
    }

    async function submitNewThread() {
      const author = document.getElementById('threadAuthor').value.trim();
      const title = document.getElementById('threadTitle').value.trim();
      const body = document.getElementById('threadContent').value.trim();

      if (!author || !title || !body) { alert("Fill out the forms completely!"); return; }

      const newTopic = {
        id: Date.now(),
        author: author,
        title: title,
        body: body,
        replies: [],
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };

      threadsDatabase.unshift(newTopic);
      renderThreadIndex();
      await uploadToDeno(); // Post straight to the cloud
      
      document.getElementById('threadAuthor').value = '';
      document.getElementById('threadTitle').value = '';
      document.getElementById('threadContent').value = '';
      returnToDashboard();
    }

    function openThreadChannel(id) {
      selectedThreadId = id;
      const target = threadsDatabase.find(x => x.id === id);
      if (!target) return;

      document.getElementById('indexView').classList.add('hidden');
      document.getElementById('channelView').classList.remove('hidden');

      document.getElementById('activeThreadTitle').innerText = target.title;
      document.getElementById('activeThreadMeta').innerHTML = `<span>👤 Posted by: ${target.author}</span> <span>🕒 Time: ${target.time}</span>`;
      document.getElementById('activeThreadBody').innerText = target.body;

      renderReplies(target.replies);
    }

    function renderReplies(repliesArray) {
      const feed = document.getElementById('nestedReplyFeed');
      feed.innerHTML = '';

      if (repliesArray.length === 0) {
        feed.innerHTML = '<p style="color:var(--text-muted); font-style:italic;">No responses yet.</p>';
        return;
      }

      repliesArray.forEach((item) => {
        const card = document.createElement('div');
        card.className = 'reply-card';
        card.innerHTML = `
          <div class="thread-info">
            <div class="reply-header"><span>👤 ${escapeHTML(item.user)}</span> <span>🕒 ${item.time}</span></div>
            <div class="reply-body">${escapeHTML(item.text)}</div>
          </div>
        `;
        feed.appendChild(card);
      });
    }

    async function submitReply() {
      const user = document.getElementById('replyAuthor').value.trim();
      const text = document.getElementById('replyText').value.trim();
      if (!user || !text) { alert("Fill out both input boxes!"); return; }

      const activeThread = threadsDatabase.find(x => x.id === selectedThreadId);
      if (!activeThread) return;

      const newReply = {
        user: user,
        text: text,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };

      activeThread.replies.push(newReply);
      renderReplies(activeThread.replies);
      await uploadToDeno(); // Sync back up

      document.getElementById('replyText').value = '';
      document.getElementById('replyAuthor').value = '';
    }

    function showNewThreadForm() {
      document.getElementById('indexView').classList.add('hidden');
      document.getElementById('createView').classList.remove('hidden');
    }

    function returnToDashboard() {
      document.getElementById('createView').classList.add('hidden');
      document.getElementById('channelView').classList.add('hidden');
      document.getElementById('indexView').classList.remove('hidden');
      renderThreadIndex();
    }

    function escapeHTML(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>

  <script defer src="/_vercel/insights/script.js"></script>
  <script defer src="/_vercel/speed-insights/script.js"></script>

</body>
</html>
